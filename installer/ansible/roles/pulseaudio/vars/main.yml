---
pulseaudio_version: "2026.11.0rc1"
pulseaudio_opt_in: false
pulseaudio_label: "PulseAudio"
pulseaudio_description: "Sound server, with network streaming"
pulseaudio_group: "Audio"
# An audio server is mandatory; which one is the audioserver choice.
pulseaudio_required: true
pulseaudio_services:
  - pulseaudio.socket
  - pulseaudio.service
# [Install] WantedBy= of units not wanted by default.target.
pulseaudio_wanted_by:
  pulseaudio.socket: sockets.target
