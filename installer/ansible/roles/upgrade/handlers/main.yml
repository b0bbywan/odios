---
# Enabling a socket doesn't bind it, so without this the web UI only answers
# after a reboot. Image mode has no running manager (the unit binds at boot).
- name: Start odioctl-web socket
  ansible.builtin.systemd:
    name: odioctl-web.socket
    state: started
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ target_user_uid }}"
  become: "{{ become_for_target_user }}"
  become_user: "{{ target_user }}"
  when: install_mode == "live"
