---
# Variables par défaut
install_mode: "live"  # live | image
target_hostname: "{{ ansible_hostname }}"
target_user: "{{ ansible_user_id }}"
odio_gpg: "https://apt.odio.love/key.gpg"
gpg_file: "/usr/share/keyrings/odio.gpg"
# odioctl ships only in the testing suite while it is a pre-release, and the
# upgrade role (which installs it) is always installed. Drop this term once
# odioctl 0.1.0 is published to stable.
odioctl_prerelease: true
# Pre-release channel, pinned at priority 50: never pulled by apt upgrade,
# installable on demand with `apt install <pkg>/testing`. On by default for
# pr-* builds, whose odio_version is a git-describe (2026.9.0b1-20-g7c1f6c4).
odio_testing_repo: "{{ install_qbzd | bool
  or odioctl_prerelease | bool
  or odio_version is search('-[0-9]+-g[0-9a-f]+$') }}"

odio_version: "unknown"
mpd_music_directory: "/media/USB"
mpd_mympd_http_port: "8080"
# Standard MPD user socket (matches the packaged mpd.socket unit's
# ListenStream=%t/mpd/socket); consumed by mpd2mpris and mpd_discplayer.
mpd_socket_path: "/run/user/{{ target_user_uid }}/mpd/socket"

# Core components (default: enabled)
install_pulseaudio: true
install_bluetooth: true
install_mpd: true
install_odio_api: true
install_upmpdcli: true

# Optional components (default: enabled — install.sh prompts default to Y)
install_mpd_discplayer: true
install_shairport_sync: true
install_snapclient: true
install_spotifyd: true
# qbzd ships only in the testing suite — selecting it turns odio_testing_repo on.
install_qbzd: false
install_mympd: "{{ install_mpd }}"
install_tidal: "{{ install_upmpdcli }}"
install_qobuz: "{{ install_upmpdcli }}"
install_upnpwebradios: "{{ install_upmpdcli }}"

# Branding (odio-motd login banner, hushlogin, .profile hook)
install_branding: true

# Smart-upgrade gate: defaults to install_X so fresh installs and
# direct ansible-playbook / image-builder paths run every selected role.
# odioctl overrides individual run_X to false when the target manifest
# matches the installed role version (skipping unchanged roles).
run_pulseaudio: "{{ install_pulseaudio }}"
run_bluetooth: "{{ install_bluetooth }}"
run_mpd: "{{ install_mpd }}"
run_odio_api: "{{ install_odio_api }}"
run_mpd_discplayer: "{{ install_mpd_discplayer }}"
run_shairport_sync: "{{ install_shairport_sync }}"
run_snapclient: "{{ install_snapclient }}"
run_upmpdcli: "{{ install_upmpdcli }}"
run_spotifyd: "{{ install_spotifyd }}"
run_qbzd: "{{ install_qbzd }}"
run_branding: "{{ install_branding }}"
# common + upgrade have no install_X opt-in (always installed); these
# defaults cover direct ansible-playbook / image-builder paths. install.sh
# overrides RUN_COMMON to Y unconditionally; odioctl may emit
# RUN_UPGRADE=N when its role version is stable.
run_common: true
run_upgrade: true
