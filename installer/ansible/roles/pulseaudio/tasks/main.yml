---
- name: Install PulseAudio packages
  ansible.builtin.apt:
    name:
      - pulseaudio
      - pulseaudio-module-zeroconf
    state: present
    install_recommends: false
  become: true
  notify: Restart pulseaudio
  when: ansible_role_name not in odios_prior_roles

- name: Copy pulse-tcp script
  ansible.builtin.copy:
    src: pulse-tcp.sh
    dest: /usr/local/bin/pulse-tcp.sh
    mode: '0755'
    owner: root
    group: root
  become: true
  notify: Restart pulse-tcp

- name: Deploy pulse-tcp service
  ansible.builtin.copy:
    src: pulse-tcp.service
    dest: "/usr/lib/systemd/user/pulse-tcp.service"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
  become: true
  notify: Restart pulse-tcp

# Unmask pulseaudio, mask pipewire — runs every time, so `audioserver`
# flipping back to pulseaudio on an existing install actually takes effect.
- name: Take the audio session over from PipeWire
  ansible.builtin.include_tasks: "../../../tasks/audioserver_takeover.yml"
  vars:
    audioserver_services: "{{ pulseaudio_services }}"
    audioserver_other: pipewire

- name: Enable user PulseAudio services
  ansible.builtin.include_tasks: "../../../tasks/systemd_enable_user.yml"
  vars:
    service_name: "{{ item }}"
    wanted_by: "{{ pulseaudio_wanted_by[item] | default('default.target') }}"
  loop: "{{ pulseaudio_services }}"
  when: ansible_role_name not in odios_prior_roles
