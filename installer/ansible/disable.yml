---
# Disables what odioctl was asked to remove, from the installed release: their
# units stop, their hooks run, then odio_api is replayed so odio-api stops
# listing them. odioctl passes the removals and install_* as what stays
# installed, and records state.json itself once this succeeds.
# Variables (extra-vars):
#   odios_disable_roles: [role, …]
#   odios_disable_features: {feature: its role, …}
- name: Odio component removal
  hosts: localhost

  gather_subset:
    - min
    - virtual

  pre_tasks:
    - name: Ensure install_mode is live
      ansible.builtin.fail:
        msg: "disable runs on a live odio, got install_mode: '{{ install_mode }}'"
      when: install_mode != "live"

    - name: Ensure target user is not root
      ansible.builtin.fail:
        msg: "target_user must not be root"
      when: target_user == "root"

    - name: Detect become requirement for target user
      ansible.builtin.set_fact:
        become_for_target_user: "{{ target_user != ansible_user_id }}"

    - name: Create ansible remote_tmp directory
      ansible.builtin.file:
        path: "/home/{{ target_user }}/.ansible/tmp"
        state: directory
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0700'
      become: true
      when: become_for_target_user

    - name: Get target user UID
      ansible.builtin.command:
        cmd: "id -u {{ target_user }}"
      register: disable_user_uid_result
      changed_when: false

    - name: Detect variables
      ansible.builtin.set_fact:
        target_user_uid: "{{ disable_user_uid_result.stdout }}"

    # odio_api's polkit and udev policies depend on it.
    - name: Detect graphical session
      ansible.builtin.include_tasks: "tasks/check_graphical_session.yml"

    - name: Read prior install state
      ansible.builtin.include_tasks: "tasks/read_state.yml"

  roles:
    - role: disable
      vars:
        disable_roles: "{{ odios_disable_roles | default([]) }}"
        disable_features: "{{ odios_disable_features | default({}) }}"
    - role: odio_api
      when: install_odio_api | bool

  post_tasks:
    - name: Remove ansible remote_tmp directory
      ansible.builtin.file:
        path: "/home/{{ target_user }}/.ansible/tmp"
        state: absent
      become: true
      when: become_for_target_user
