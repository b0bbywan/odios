---
# odios_role_pre_scaffold: true on installs predating the latest snapclient scaffold
# (snapclient.conf and startup weight, 2026.11.0rc1).
- name: Resolve prior role version
  ansible.builtin.include_tasks: "../../../tasks/resolve_prior_version.yml"
  vars:
    scaffold_version: '2026.11.0rc1'

- name: Snapclient install and system service (first install)
  when: ansible_role_name not in odios_prior_roles
  block:
    - name: Install snapclient
      ansible.builtin.apt:
        name: snapclient
        state: present
        install_recommends: false
      become: true
      notify: Restart snapclient

    - name: Disable system snapclient service
      ansible.builtin.include_tasks: "../../../tasks/systemd_disable_system.yml"
      vars:
        service_name: snapclient.service

- name: Create snapclient config directory
  ansible.builtin.file:
    path: "/home/{{ target_user }}/.config/snapclient"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'
  become: "{{ become_for_target_user }}"
  when: odios_role_pre_scaffold | bool

- name: Backup snapclient config before changes
  ansible.builtin.include_tasks: "../../../tasks/backup_conf_before.yml"
  vars:
    conf_path: "/home/{{ target_user }}/.config/snapclient/snapclient.conf"
    conf_owner: "{{ target_user }}"
    conf_group: "{{ target_user }}"
    conf_mode: '0644'

- name: Deploy snapclient config
  ansible.builtin.template:
    src: snapclient.conf.j2
    dest: "/home/{{ target_user }}/.config/snapclient/snapclient.conf"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
  become: "{{ become_for_target_user }}"
  notify: Restart snapclient

- name: Backup snapclient config after changes
  ansible.builtin.include_tasks: "../../../tasks/backup_conf_after.yml"
  vars:
    conf_path: "/home/{{ target_user }}/.config/snapclient/snapclient.conf"
    conf_owner: "{{ target_user }}"
    conf_group: "{{ target_user }}"
    conf_mode: '0644'

- name: Deploy user snapclient service
  ansible.builtin.template:
    src: snapclient.service.j2
    dest: /usr/lib/systemd/user/snapclient.service
    mode: '0644'
    owner: root
    group: root
  become: true
  notify: Restart snapclient

- name: Enable user snapclient service
  ansible.builtin.include_tasks: "../../../tasks/systemd_enable_user.yml"
  vars:
    service_name: snapclient.service
  when: ansible_role_name not in odios_prior_roles

- name: Install snapclientmpris
  ansible.builtin.include_tasks: snapclientmpris.yml
