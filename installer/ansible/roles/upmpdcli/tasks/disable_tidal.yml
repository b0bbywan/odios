---
# Run by the disable role. Commented, not removed: tidal.yml's ^#? uncomments it.
- name: Comment out tidal user
  ansible.builtin.lineinfile:
    path: "/home/{{ target_user }}/.config/upmpdcli/upmpdcli.conf"
    regexp: '^(tidaluser\s*=.*)$'
    line: '#\1'
    backrefs: true
  become: "{{ become_for_target_user }}"
  become_user: "{{ target_user }}"
  notify: Restart upmpdcli
