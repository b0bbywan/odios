---
spotifyd_version: "2026.9.0b3"
spotifyd_apt_version: "0.4.4"
spotifyd_label: "Spotify Connect"
spotifyd_description: "Play from the Spotify app"
spotifyd_group: "Streaming"
spotifyd_services:
  - spotifyd.service

# librespot backends are alsa/pulseaudio/rodio/pipe — no native pipewire, so
# PipeWire is driven through its pulse compatibility layer.
spotifyd_audioserver_backend:
  pulseaudio: "pulseaudio"
  pipewire: "pulseaudio"
