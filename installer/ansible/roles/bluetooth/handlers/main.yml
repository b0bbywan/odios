---
- name: Reload udev rules
  ansible.builtin.command: udevadm control --reload-rules
  become: true
  changed_when: false
  args:
    removes: /run/udev/control

- name: Restart bluetooth
  ansible.builtin.systemd:
    name: bluetooth.service
    state: restarted
  become: true
  when: install_mode == "live"

# module-bluetooth only probes A2DP codecs (aptX via gstreamer) when it loads.
- name: Restart pulseaudio for bluetooth codecs
  ansible.builtin.include_tasks: "../../../tasks/systemd_restart_user.yml"
  vars:
    service_name: pulseaudio.service
