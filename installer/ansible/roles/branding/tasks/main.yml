---
# odios_role_pre_scaffold: true on installs predating `odioctl motd` (2026.9.0b3),
# which replaced the local odio-motd script.
- name: Resolve prior role version
  ansible.builtin.include_tasks: "../../../tasks/resolve_prior_version.yml"
  vars:
    scaffold_version: '2026.9.0b3'

- name: Hook odio-motd into ~/.profile
  ansible.builtin.blockinfile:
    path: "/home/{{ target_user }}/.profile"
    create: true
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
    marker: "# {mark} ANSIBLE MANAGED BLOCK - odio-motd"
    block: |
      case $- in
          *i*) command -v odioctl >/dev/null && odioctl motd ;;
      esac
  become: "{{ become_for_target_user }}"

- name: Remove legacy odio-motd script
  ansible.builtin.file:
    path: "/home/{{ target_user }}/.local/bin/odio-motd"
    state: absent
  become: "{{ become_for_target_user }}"
  when:
    - ansible_role_name in odios_prior_roles
    - odios_role_pre_scaffold | bool

- name: Suppress system motd for odio user
  ansible.builtin.file:
    path: "/home/{{ target_user }}/.hushlogin"
    state: touch
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
    modification_time: preserve
    access_time: preserve
  become: "{{ become_for_target_user }}"
