---
# Run by the disable role: branding has no unit, only what main.yml left.
- name: Unhook odio-motd from ~/.profile
  ansible.builtin.blockinfile:
    path: "/home/{{ target_user }}/.profile"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - odio-motd"
    state: absent
  become: "{{ become_for_target_user }}"

- name: Bring the system motd back
  ansible.builtin.file:
    path: "/home/{{ target_user }}/.hushlogin"
    state: absent
  become: "{{ become_for_target_user }}"
