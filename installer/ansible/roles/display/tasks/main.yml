---
# install.sh never selects display elsewhere; this covers direct playbook runs.
- name: Read dpkg architecture
  ansible.builtin.command: dpkg --print-architecture
  register: display_dpkg_arch
  changed_when: false

- name: Assert display is available on this architecture
  ansible.builtin.assert:
    that: display_dpkg_arch.stdout in display_archs
    fail_msg: "display needs {{ display_archs | join(' or ') }}, this system is {{ display_dpkg_arch.stdout }}"
    quiet: true

# A user manager already up keeps its old group list: on a live install the
# membership only takes effect on target_user's next login (or reboot).
- name: Ensure user in display groups
  ansible.builtin.user:
    name: "{{ target_user }}"
    append: true
    groups:
      - tty
      - video
  become: true

- name: Install odio-kiosk
  ansible.builtin.apt:
    name:
      - "odio-kiosk>={{ display_apt_version }}"
    state: present
    install_recommends: false
  become: true
  register: display_apt
  notify: Restart odio-kiosk

# The package ships odio-kiosk@.service; image mode has no running manager.
- name: Reload user systemd
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ target_user_uid }}"
  become: "{{ become_for_target_user }}"
  become_user: "{{ target_user }}"
  when:
    - install_mode == "live"
    - display_apt.changed
  register: display_apt

# odio-kiosk replaces fbrowser-kiosk, but dpkg owns neither the old user
# config nor the enable symlink odio-screen.service left behind.
- name: Remove fbrowser-kiosk leftovers
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/home/{{ target_user }}/.config/fbrowser-kiosk"
    - "/home/{{ target_user }}/.config/systemd/user/default.target.wants/odio-screen.service"
  become: "{{ become_for_target_user }}"

- name: Create odio-kiosk config directory
  ansible.builtin.file:
    path: "/home/{{ target_user }}/.config/odio-kiosk"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0700'
  become: "{{ become_for_target_user }}"

- name: Configure the odio screen
  ansible.builtin.copy:
    src: odio.conf
    dest: "/home/{{ target_user }}/.config/odio-kiosk/{{ display_instance }}.conf"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0600'
  become: "{{ become_for_target_user }}"
  notify: Restart odio-kiosk

- name: Create odio-kiosk drop-in directory
  ansible.builtin.file:
    path: "/home/{{ target_user }}/.config/systemd/user/odio-kiosk@{{ display_instance }}.service.d"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'
  become: "{{ become_for_target_user }}"

# The unit names no server: the drop-in is what ties this screen to odio-api.
- name: Order the odio screen with odio-api
  ansible.builtin.copy:
    src: odio-api.conf
    dest: "/home/{{ target_user }}/.config/systemd/user/odio-kiosk@{{ display_instance }}.service.d/odio-api.conf"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
  become: "{{ become_for_target_user }}"
  notify: Restart odio-kiosk

- name: Enable user odio-kiosk service
  ansible.builtin.include_tasks: "../../../tasks/systemd_enable_user.yml"
  vars:
    service_name: "odio-kiosk@{{ display_instance }}.service"
    service_unit_path: /usr/lib/systemd/user/odio-kiosk@.service
