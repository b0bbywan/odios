---
qbzd_version: "2026.9.0b2"
qbzd_apt_version: "2.1.2"

qbzd_http_port: "8182"
qbzd_conf_path: "/home/{{ target_user }}/.config/qbzd/qbzd.toml"
# Player settings applied via `qbzd settings set` (SQLite-backed, not a file).
# Keys and accepted values come from `qbzd settings show`.
qbzd_player_settings:
  audio.allow_quality_fallback: "true"
  audio.backend: pulse
  audio.normalization_enabled: "false"
  audio.quality_fallback_behavior: always_fallback
  playback.mpris: "true"
  qconnect.device_name: "{{ target_hostname }}"
  qconnect.startup_mode: "on"
