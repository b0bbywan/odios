---
- name: Install qbzd v{{ qbzd_apt_version }}
  ansible.builtin.apt:
    name: "qbzd={{ qbzd_apt_version }}"
    state: present
  become: true
  notify: Restart qbzd

- name: Create qbzd config directory
  ansible.builtin.file:
    path: "/home/{{ target_user }}/.config/qbzd"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0700'
  become: "{{ become_for_target_user }}"
  when: ansible_role_name not in odios_prior_roles

- name: Deploy qbzd config
  ansible.builtin.template:
    src: qbzd.toml.j2
    dest: "{{ qbzd_conf_path }}"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
  become: "{{ become_for_target_user }}"
  notify: Restart qbzd

# Player settings are SQLite-backed, so they are read/written through the CLI
# rather than templated. `settings set` works with the daemon down (image mode).
- name: Read qbzd player settings
  ansible.builtin.command: qbzd settings show
  register: qbzd_settings_show
  changed_when: false
  become: "{{ become_for_target_user }}"
  become_user: "{{ target_user }}"

- name: Apply qbzd player settings
  ansible.builtin.command: "qbzd settings set {{ item.key }} {{ item.value }}"
  loop: "{{ qbzd_player_settings | dict2items }}"
  loop_control:
    label: "{{ item.key }}={{ item.value }}"
  when: _qbzd_current[item.key] | default('') != item.value | string
  changed_when: true
  become: "{{ become_for_target_user }}"
  become_user: "{{ target_user }}"
  vars:
    _qbzd_current: >-
      {{ dict(qbzd_settings_show.stdout_lines
              | map('regex_replace', '^(\S+)\s+=\s?(.*)$', '\1|\2')
              | map('split', '|', 1)) }}
  notify: Restart qbzd

# The deb ships /usr/lib/systemd/user/qbzd.service (WantedBy=default.target).
# Starting before `qbzd setup` is fine — it logs "Not logged in" and stays up.
- name: Enable user qbzd service
  ansible.builtin.include_tasks: "../../../tasks/systemd_enable_user.yml"
  vars:
    service_name: qbzd.service
  when: ansible_role_name not in odios_prior_roles
