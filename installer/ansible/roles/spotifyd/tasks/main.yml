---
# odios_role_pre_scaffold: true on installs predating the latest spotifyd scaffold
# (startup weight and env drop-in, 2026.11.0rc1).
- name: Resolve prior role version
  ansible.builtin.include_tasks: "../../../tasks/resolve_prior_version.yml"
  vars:
    scaffold_version: '2026.11.0rc1'

- name: Install spotifyd v{{ spotifyd_apt_version }}
  ansible.builtin.apt:
    name: "spotifyd>={{ spotifyd_apt_version }}"
    state: present
  become: true
  notify: Restart spotifyd

- name: Create spotifyd config directory
  ansible.builtin.file:
    path: "/home/{{ target_user }}/.config/spotifyd"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'
  become: "{{ become_for_target_user }}"
  when: ansible_role_name not in odios_prior_roles

- name: Backup spotifyd config before changes
  ansible.builtin.include_tasks: "../../../tasks/backup_conf_before.yml"
  vars:
    conf_path: "/home/{{ target_user }}/.config/spotifyd/spotifyd.conf"
    conf_owner: "{{ target_user }}"
    conf_group: "{{ target_user }}"
    conf_mode: '0644'

- name: Deploy spotifyd config
  ansible.builtin.template:
    src: spotifyd.conf.j2
    dest: "/home/{{ target_user }}/.config/spotifyd/spotifyd.conf"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
  become: "{{ become_for_target_user }}"
  notify: Restart spotifyd

- name: Backup spotifyd config after changes
  ansible.builtin.include_tasks: "../../../tasks/backup_conf_after.yml"
  vars:
    conf_path: "/home/{{ target_user }}/.config/spotifyd/spotifyd.conf"
    conf_owner: "{{ target_user }}"
    conf_group: "{{ target_user }}"
    conf_mode: '0644'

- name: Enable user spotifyd service
  ansible.builtin.include_tasks: "../../../tasks/systemd_enable_user.yml"
  vars:
    service_name: spotifyd.service
  when: ansible_role_name not in odios_prior_roles

- name: Spotifyd scaffold
  when: odios_role_pre_scaffold | bool
  block:
    - name: Lower spotifyd startup CPU weight
      ansible.builtin.include_tasks: "../../../tasks/systemd_startup_weight_user.yml"
      vars:
        service_name: spotifyd.service

    - name: Load spotifyd environment
      ansible.builtin.copy:
        content: |
          [Service]
          EnvironmentFile=%h/.config/spotifyd/spotifyd.env
        dest: /usr/lib/systemd/user/spotifyd.service.d/odio-env.conf
        owner: root
        group: root
        mode: '0644'
      become: true
      notify: Restart spotifyd

- name: Deploy spotifyd environment
  ansible.builtin.template:
    src: spotifyd.env.j2
    dest: "/home/{{ target_user }}/.config/spotifyd/spotifyd.env"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
  become: "{{ become_for_target_user }}"
  notify: Restart spotifyd
